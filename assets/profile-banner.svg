<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Vishal Patel — Software Developer</title>
<desc id="desc">A dark navy technical portfolio banner with a subtle grid, abstract connected nodes, and developer identity.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#080d1b"/>
    <stop offset=".55" stop-color="#101d35"/>
    <stop offset="1" stop-color="#073b55"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#38bdf8" stop-opacity=".05"/>
    <stop offset="1" stop-color="#60a5fa" stop-opacity=".4"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#93c5fd" stroke-opacity=".08" stroke-width="1"/>
  </pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="360" rx="24" fill="url(#bg)"/>
<rect width="1200" height="360" rx="24" fill="url(#grid)"/>
<path d="M700 0L1200 0 1200 360 900 360Z" fill="#0b1930" opacity=".42"/>
<g fill="none" stroke="url(#line)" stroke-width="2">
  <path d="M790 90L930 145L1080 75L1150 170L1010 260L860 230L790 90"/>
  <path d="M930 145L1010 260M1080 75L1010 260M860 230L930 145"/>
  <path d="M790 90L860 230M1080 75L1150 170"/>
</g>
<g fill="#38bdf8" filter="url(#glow)">
  <circle cx="790" cy="90" r="5"/><circle cx="930" cy="145" r="6"/>
  <circle cx="1080" cy="75" r="5"/><circle cx="1150" cy="170" r="5"/>
  <circle cx="1010" cy="260" r="6"/><circle cx="860" cy="230" r="5"/>
</g>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <text x="82" y="105" fill="#7dd3fc" font-size="16" letter-spacing="4">DEVELOPER PORTFOLIO / 2026</text>
  <text x="78" y="177" fill="#f8fafc" font-size="58" font-weight="700" letter-spacing="-2">VISHAL PATEL</text>
  <rect x="82" y="205" width="54" height="4" rx="2" fill="#38bdf8"/>
  <text x="82" y="250" fill="#cbd5e1" font-size="21">Java  /  Backend Engineering  /  Problem Solving</text>
  <text x="82" y="300" fill="#64748b" font-size="14" letter-spacing="2">LEARN  ·  BUILD  ·  IMPROVE</text>
  <text x="820" y="315" fill="#7dd3fc" font-size="13" letter-spacing="2">SYSTEMS THINKING</text>
</g>
</svg>