<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300" role="img" aria-labelledby="title desc">
<title id="title">Pegasus — Vishal's developer mascot</title>
<desc id="desc">A playful cyan and violet cyber Pegasus with a tiny star on its forehead, animated wings, a floating motion, and sparkles.</desc>
<defs>
  <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e0f2fe"/><stop offset=".55" stop-color="#7dd3fc"/><stop offset="1" stop-color="#818cf8"/>
  </linearGradient>
  <linearGradient id="mane" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f0abfc"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#38bdf8"/>
  </linearGradient>
  <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#67e8f9"/>
  </linearGradient>
  <filter id="softGlow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<g>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="3s" repeatCount="indefinite"/>
  <!-- tail -->
  <path d="M92 177 C50 172 56 126 29 122 C47 149 20 164 42 190 C58 210 79 198 96 190" fill="none" stroke="url(#mane)" stroke-width="13" stroke-linecap="round"/>
  <path d="M44 128 Q26 102 15 115 Q25 139 43 145" fill="#c4b5fd"/>
  <!-- back legs -->
  <path d="M116 191 Q104 224 113 247 L132 247 Q135 219 151 203" fill="url(#coat)" stroke="#dbeafe" stroke-width="2"/>
  <path d="M185 195 Q190 225 177 246 L197 250 Q218 222 216 194" fill="url(#coat)" stroke="#dbeafe" stroke-width="2"/>
  <path d="M111 245 Q121 239 135 246 L135 255 Q119 261 109 253Z" fill="#a78bfa"/>
  <path d="M176 245 Q188 240 200 248 L198 257 Q182 262 173 253Z" fill="#a78bfa"/>
  <!-- body -->
  <ellipse cx="164" cy="177" rx="76" ry="43" fill="url(#coat)" stroke="#e0f2fe" stroke-width="2"/>
  <!-- front legs -->
  <path d="M211 185 Q226 213 218 246 L237 248 Q252 215 239 182" fill="url(#coat)" stroke="#dbeafe" stroke-width="2"/>
  <path d="M239 246 Q250 240 262 248 L260 257 Q244 263 235 254Z" fill="#a78bfa"/>
  <path d="M153 197 Q151 221 143 246 L162 250 Q180 220 177 195" fill="url(#coat)" stroke="#dbeafe" stroke-width="2"/>
  <path d="M140 245 Q151 240 164 248 L161 257 Q146 262 137 254Z" fill="#a78bfa"/>
  <!-- neck and head -->
  <path d="M194 158 Q218 123 216 96 Q231 72 259 82 Q283 91 277 119 Q272 142 247 151 L230 180Z" fill="url(#coat)" stroke="#e0f2fe" stroke-width="2"/>
  <path d="M214 99 Q205 76 218 61 Q234 72 232 91" fill="#c4b5fd" stroke="#e0e7ff" stroke-width="2"/>
  <path d="M255 82 Q261 57 279 55 Q278 77 268 91" fill="#c4b5fd" stroke="#e0e7ff" stroke-width="2"/>
  <!-- muzzle -->
  <path d="M259 119 Q286 111 300 125 Q304 142 286 148 L254 139Z" fill="#bae6fd" stroke="#e0f2fe" stroke-width="2"/>
  <ellipse cx="292" cy="132" rx="3.5" ry="2.5" fill="#334155"/>
  <!-- horn -->
  <path d="M245 82 L253 40 L268 83Z" fill="#fef08a" stroke="#fde68a" stroke-width="2"/>
  <path d="M250 65 L261 65" stroke="#f59e0b" stroke-width="2"/>
  <!-- mane -->
  <path d="M215 91 Q190 62 205 42 Q211 62 226 63 Q219 39 237 27 Q235 53 250 62 Q260 42 277 38 Q267 65 273 87 Q252 77 239 99Z" fill="url(#mane)" stroke="#ddd6fe" stroke-width="1.5"/>
  <path d="M219 145 Q203 160 199 181 Q217 171 228 155" fill="url(#mane)"/>
  <!-- eye + star -->
  <ellipse cx="270" cy="108" rx="4" ry="5" fill="#1e293b"/>
  <circle cx="271" cy="106" r="1.4" fill="#fff"/>
  <path d="M245 100 L249 108 L258 109 L251 115 L253 124 L245 119 L237 124 L239 115 L232 109 L241 108Z" fill="#fde68a" stroke="#fff7ae" stroke-width="1" filter="url(#softGlow)"/>
  <!-- animated wing -->
  <g transform="translate(147 153)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 15 35;-20 15 35;0 15 35;12 15 35;0 15 35" dur="1.25s" repeatCount="indefinite"/>
      <path d="M8 40 Q-12 3 13 -37 Q24 -14 31 -4 Q36 -36 56 -49 Q59 -16 50 4 Q74 -12 89 -8 Q75 24 43 51Z" fill="url(#wing)" stroke="#e0f2fe" stroke-width="2"/>
      <path d="M12 31 Q22 4 13 -24 M28 38 Q42 8 31 -26 M43 38 Q59 11 56 -25 M56 27 Q72 6 82 0" fill="none" stroke="#60a5fa" stroke-opacity=".75" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</g>

<!-- orbiting sparkles -->
<g fill="#fde68a" filter="url(#softGlow)">
  <path d="M65 70 L70 83 L83 88 L70 93 L65 106 L60 93 L47 88 L60 83Z">
    <animate attributeName="opacity" values=".25;1;.25" dur="1.8s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 65 88;90 65 88;180 65 88;270 65 88;360 65 88" dur="8s" repeatCount="indefinite"/>
  </path>
  <path d="M310 190 L314 200 L324 204 L314 208 L310 218 L306 208 L296 204 L306 200Z">
    <animate attributeName="opacity" values="1;.2;1" dur="2.2s" repeatCount="indefinite"/>
  </path>
</g>
<circle cx="85" cy="235" r="4" fill="#38bdf8"><animate attributeName="cy" values="235;220;235" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cx="318" cy="65" r="3" fill="#c4b5fd"><animate attributeName="r" values="2;5;2" dur="1.7s" repeatCount="indefinite"/></circle>
</svg>